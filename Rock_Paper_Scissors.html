<!doctype html>
<html lang="en">
  <head>
    <title>Rock Paper Scissors</title>
  </head>

  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissors')">Scissors</button>
    <button onclick="resetButton()">Reset Score</button>
    <script>
      let score = JSON.parse(localStorage.getItem("score")) || {
          wins:0,
          loses:0,
          ties:0
      }


      function playGame(playerMove) {
        const computerGuess = pickComputerMove();
        let result = "";
        if (playerMove === "scissors") {
          if (computerGuess === "Rock") {
            result = `You lose`;
          } else if (computerGuess === "Paper") {
            result = `You win`;
          } else if (computerGuess === "Scissors") {
            result = `Tie`;
          }
        } else if (playerMove === "paper") {
          if (computerGuess === "Rock") {
            result = `You win`;
          } else if (computerGuess === "Paper") {
            result = `Tie`;
          } else if (computerGuess === "Scissors") {
            result = `You lose`;
          }
        } else if (playerMove === "rock") {
          if (computerGuess === "Rock") {
            result = `You win`;
          } else if (computerGuess === "Paper") {
            result = `Tie`;
          } else if (computerGuess === "Scissors") {
            result = `You lose`;
          }
        }

        if (result === "You win") {
          score.wins += 1;
        } else if (result === "You lose") {
          score.loses += 1;
        } else if (result === "Tie") {
          score.ties += 1;
        }

        localStorage.setItem("score",JSON.stringify(score));


        alert(
          `You Pick ${playerMove} Computer Pick ${computerGuess} ${result}.
Wins:${score.wins} Loses:${score.loses} Ties:${score.ties}`,
        );
      }


      function resetButton() {
        score.wins = 0,
        score.loses = 0,
        score.ties = 0,
        localStorage.removeItem("score")
      }
   

      function pickComputerMove() {
        const random_number = Math.random();
        let computerGuess = "";
        if (random_number >= 0 && random_number < 1 / 3) {
          computerGuess = `Rock`;
        } else if (random_number >= 1 / 3 && random_number < 2 / 3) {
          computerGuess = `Paper`;
        } else if (random_number >= 2 / 3 && random_number < 1) {
          computerGuess = `Scissors`;
        }
        return computerGuess;
      }
    </script>
  </body>
</html>
